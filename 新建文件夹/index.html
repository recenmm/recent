<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宋昱璇 · 个人简历</title>
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --color-primary: #1a365d;
            --color-primary-light: #2b4c7e;
            --color-accent: #c9a84c;
            --color-accent-light: #e8d5a3;
            --color-bg: #f4f7fb;
            --color-card: #ffffff;
            --color-text: #1a202c;
            --color-text-secondary: #4a5568;
            --color-border: #e2e8f0;
            --color-shadow: rgba(26, 54, 93, 0.10);
            --radius: 16px;
            --transition: 0.2s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            --max-width: 1100px;
            --nav-height: 64px;
        }

        [data-theme="dark"] {
            --color-bg: #0f1724;
            --color-card: #1a2332;
            --color-text: #e8edf5;
            --color-text-secondary: #a0b4cc;
            --color-border: #2d3a4f;
            --color-shadow: rgba(0, 0, 0, 0.4);
            --color-primary: #4a7bb5;
            --color-primary-light: #6a9bcf;
            --color-accent: #dbb95a;
            --color-accent-light: #f0e0a8;
        }

        /* ===== Reset & Base ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--nav-height);
            padding-bottom: 2rem;
            min-height: 100vh;
        }

        a {
            color: var(--color-primary);
            text-decoration: none;
        }
        a:hover {
            color: var(--color-accent);
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-primary-light);
            border-radius: 8px;
        }

        /* ===== Container ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* ===== Navigation ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--color-card);
            border-bottom: 1px solid var(--color-border);
            box-shadow: 0 2px 12px var(--color-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 1000;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.92);
        }
        [data-theme="dark"] .navbar {
            background: rgba(26, 35, 50, 0.92);
        }

        .navbar-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .navbar-brand span {
            color: var(--color-accent);
        }

        .navbar-links {
            display: flex;
            gap: 0.2rem 1rem;
            flex-wrap: wrap;
            align-items: center;
            list-style: none;
        }
        .navbar-links a {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            transition: color var(--transition), background var(--transition);
            cursor: pointer;
        }
        .navbar-links a:hover {
            color: var(--color-primary);
            background: var(--color-border);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .navbar-actions button {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--color-text-secondary);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            transition: background var(--transition), color var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }
        .navbar-actions button:hover {
            background: var(--color-border);
            color: var(--color-text);
        }
        .navbar-actions .print-btn {
            font-size: 1.0rem;
        }

        /* ===== Hero ===== */
        .hero {
            padding: 2rem 0 1.5rem;
            text-align: center;
        }
        /* 新布局：flex 左文字右头像二维码 */
        .hero-top {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2rem;
            margin-bottom: 0.8rem;
        }
        .hero-left {
            text-align: left;
            flex: 1 1 300px;
        }
        .hero-right {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex: 0 0 auto;
        }
        .hero-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--color-accent);
            box-shadow: 0 4px 14px var(--color-shadow);
            transition: transform 0.2s;
            background: var(--color-border);
        }
        .hero-avatar:hover {
            transform: scale(1.05);
        }
        .hero-qrcode {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--color-border);
            box-shadow: 0 4px 12px var(--color-shadow);
            transition: transform 0.2s;
            background: var(--color-border);
        }
        .hero-qrcode:hover {
            transform: scale(1.05);
        }

        .hero-name {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--color-primary);
            line-height: 1.2;
        }
        .hero-name span {
            color: var(--color-accent);
        }
        .hero-quote {
            font-size: 1.0rem;
            font-style: italic;
            color: var(--color-text-secondary);
            margin-top: 0.2rem;
            opacity: 0.8;
            letter-spacing: 0.3px;
        }
        .hero-title {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-top: 0.2rem;
            font-weight: 400;
        }
        .hero-summary {
            max-width: 700px;
            margin: 1.2rem auto 0;
            font-size: 0.98rem;
            color: var(--color-text-secondary);
            line-height: 1.7;
        }

        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem 0.8rem;
            margin-top: 1.2rem;
        }
        .hero-tags .tag {
            background: var(--color-border);
            color: var(--color-text-secondary);
            padding: 0.25rem 1rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            transition: background var(--transition), color var(--transition);
        }
        .hero-tags .tag.highlight {
            background: var(--color-accent);
            color: #fff;
        }

        .hero-contact {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem 1.8rem;
            margin-top: 1.5rem;
            font-size: 0.92rem;
            color: var(--color-text-secondary);
        }
        .hero-contact .item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .hero-contact .item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            fill: none;
            stroke: var(--color-text-secondary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .hero-contact .copy-btn {
            background: none;
            border: none;
            color: var(--color-primary);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            transition: background var(--transition);
        }
        .hero-contact .copy-btn:hover {
            background: var(--color-border);
        }

        /* ===== Highlights ===== */
        .highlights {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        .highlights .card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 1.2rem 1.4rem;
            box-shadow: 0 2px 8px var(--color-shadow);
            border: 1px solid var(--color-border);
            transition: transform var(--transition), box-shadow var(--transition);
            text-align: center;
        }
        .highlights .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px var(--color-shadow);
        }
        .highlights .card .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-primary);
        }
        .highlights .card .label {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            margin-top: 0.2rem;
        }

        /* ===== Section Headers ===== */
        .section-header {
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            margin: 2.5rem 0 1.2rem;
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 0.5rem;
        }
        .section-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: 1px;
        }
        .section-header .badge {
            font-size: 0.75rem;
            background: var(--color-accent);
            color: #fff;
            padding: 0.1rem 0.7rem;
            border-radius: 12px;
            font-weight: 600;
        }

        /* ===== Tabs ===== */
        .tabs {
            margin: 1rem 0 0.5rem;
        }
        .tabs-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 0.2rem;
        }
        .tabs-nav button {
            background: none;
            border: none;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: background var(--transition), color var(--transition), box-shadow var(--transition);
            position: relative;
            font-family: inherit;
        }
        .tabs-nav button:hover {
            background: var(--color-border);
            color: var(--color-text);
        }
        .tabs-nav button[aria-selected="true"] {
            color: var(--color-primary);
            background: var(--color-card);
            box-shadow: 0 -2px 0 var(--color-accent) inset;
        }
        .tabs-panel {
            display: none;
            padding: 1.2rem 0.2rem;
            animation: fadeIn 0.25s ease;
        }
        .tabs-panel[aria-hidden="false"] {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Experience Cards ===== */
        .exp-item {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 1.2rem 1.6rem;
            margin-bottom: 1rem;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 6px var(--color-shadow);
            transition: transform var(--transition), box-shadow var(--transition);
        }
        .exp-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--color-shadow);
        }
        .exp-item .head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.3rem;
        }
        .exp-item .head .title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--color-primary);
        }
        .exp-item .head .org {
            font-weight: 500;
            color: var(--color-text-secondary);
        }
        .exp-item .head .period {
            font-size: 0.82rem;
            color: var(--color-text-secondary);
            background: var(--color-border);
            padding: 0.1rem 0.8rem;
            border-radius: 12px;
        }
        .exp-item ul {
            list-style: none;
            padding: 0;
            margin-top: 0.5rem;
        }
        .exp-item ul li {
            padding: 0.2rem 0 0.2rem 1.4rem;
            position: relative;
            font-size: 0.92rem;
            color: var(--color-text-secondary);
        }
        .exp-item ul li::before {
            content: "▹";
            position: absolute;
            left: 0;
            color: var(--color-accent);
            font-weight: 700;
        }

        /* ===== Project Cards (Tab panels) ===== */
        .project-card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 1.2rem 1.6rem;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 6px var(--color-shadow);
            transition: transform var(--transition), box-shadow var(--transition);
            margin-bottom: 1rem;
        }
        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--color-shadow);
        }
        .project-card .head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.2rem;
        }
        .project-card .head .name {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--color-primary);
        }
        .project-card .head .meta {
            font-size: 0.82rem;
            color: var(--color-text-secondary);
        }
        .project-card .tech {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.6rem;
            margin: 0.5rem 0 0.4rem;
        }
        .project-card .tech span {
            background: var(--color-border);
            padding: 0.1rem 0.7rem;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--color-text-secondary);
        }
        .project-card ul {
            list-style: none;
            padding: 0;
            margin-top: 0.3rem;
        }
        .project-card ul li {
            padding: 0.15rem 0 0.15rem 1.4rem;
            position: relative;
            font-size: 0.9rem;
            color: var(--color-text-secondary);
        }
        .project-card ul li::before {
            content: "▹";
            position: absolute;
            left: 0;
            color: var(--color-accent);
            font-weight: 700;
        }

        /* ===== Skills ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin: 1rem 0;
        }
        .skills-grid .group {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 1rem 1.2rem;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 6px var(--color-shadow);
        }
        .skills-grid .group h4 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.3px;
        }
        .skills-grid .group .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.6rem;
        }
        .skills-grid .group .chips span {
            background: var(--color-border);
            padding: 0.15rem 0.8rem;
            border-radius: 14px;
            font-size: 0.78rem;
            color: var(--color-text-secondary);
            font-weight: 450;
        }

        /* ===== Education & Awards ===== */
        .edu-block {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 1.2rem 1.6rem;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 6px var(--color-shadow);
            margin-bottom: 1.2rem;
        }
        .edu-block .school {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--color-primary);
        }
        .edu-block .major {
            font-weight: 500;
            color: var(--color-text-secondary);
        }
        .edu-block .period {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }
        .edu-block .detail {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            margin-top: 0.3rem;
        }
        .edu-block .courses {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            margin-top: 0.2rem;
        }

        .awards-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.6rem 1rem;
            margin-top: 0.5rem;
        }
        .awards-list .award {
            background: var(--color-card);
            border-radius: 10px;
            padding: 0.6rem 1rem;
            border: 1px solid var(--color-border);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
            transition: background var(--transition);
        }
        .awards-list .award .name {
            font-weight: 500;
            color: var(--color-text);
        }
        .awards-list .award .source {
            font-size: 0.78rem;
            color: var(--color-text-secondary);
        }
        .awards-list .award .date {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            background: var(--color-border);
            padding: 0.05rem 0.6rem;
            border-radius: 10px;
        }

        /* Certificate images */
        .cert-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin-bottom: 1.8rem;
            justify-content: center;
        }
        .cert-gallery .cert-card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 0.8rem 0.8rem 0.6rem;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 10px var(--color-shadow);
            max-width: 260px;
            flex: 1 1 180px;
            transition: transform var(--transition), box-shadow var(--transition);
            text-align: center;
        }
        .cert-gallery .cert-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--color-shadow);
        }
        .cert-gallery .cert-card img {
            width: 100%;
            border-radius: 8px;
            display: block;
            background: #f0f0f0;
            border: 1px solid var(--color-border);
            max-height: 180px;
            object-fit: contain;
        }
        .cert-gallery .cert-card .cert-label {
            margin-top: 0.4rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--color-primary);
        }
        .cert-gallery .cert-card .cert-sub {
            font-size: 0.78rem;
            color: var(--color-text-secondary);
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 2rem 0 0.5rem;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            border-top: 1px solid var(--color-border);
            margin-top: 2.5rem;
        }

        /* ===== Back to Top ===== */
        .back-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--color-primary);
            color: #fff;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--color-shadow);
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.3s, transform 0.3s, background var(--transition);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-top.visible {
            opacity: 1;
            transform: scale(1);
        }
        .back-top:hover {
            background: var(--color-accent);
        }

        /* ===== Print Styles ===== */
        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
                padding-top: 0 !important;
                font-size: 11pt;
            }
            .navbar,
            .back-top,
            .navbar-actions {
                display: none !important;
            }
            .container {
                max-width: 100% !important;
                padding: 0 0.5in !important;
            }
            .hero {
                padding-top: 0.5rem !important;
            }
            .hero-name {
                font-size: 22pt !important;
                color: #1a365d !important;
            }
            .hero-avatar, .hero-qrcode {
                width: 70px !important;
                height: 70px !important;
            }
            .hero-top {
                gap: 1.2rem;
            }
            .card,
            .exp-item,
            .project-card,
            .edu-block,
            .skills-grid .group,
            .awards-list .award,
            .highlights .card,
            .cert-gallery .cert-card {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
                background: #fff !important;
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .highlights {
                grid-template-columns: repeat(4, 1fr) !important;
            }
            .tabs-nav button {
                background: #f0f0f0 !important;
                color: #000 !important;
            }
            .tabs-nav button[aria-selected="true"] {
                background: #fff !important;
                box-shadow: 0 -2px 0 #c9a84c inset !important;
            }
            .tabs-panel {
                display: block !important;
                animation: none !important;
            }
            [data-theme="dark"] {
                --color-bg: #fff !important;
                --color-card: #fff !important;
                --color-text: #000 !important;
                --color-text-secondary: #333 !important;
                --color-border: #ccc !important;
                --color-primary: #1a365d !important;
                --color-accent: #c9a84c !important;
            }
            .section-header h2 {
                color: #1a365d !important;
            }
            .hero-contact .copy-btn {
                display: none !important;
            }
            .hero-tags .tag.highlight {
                background: #c9a84c !important;
                color: #fff !important;
            }
            .project-card .tech span {
                background: #eee !important;
            }
            .awards-list .award .date {
                background: #eee !important;
            }
            .exp-item ul li::before,
            .project-card ul li::before {
                color: #c9a84c !important;
            }
            .cert-gallery .cert-card img {
                max-height: 140px;
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 1rem;
                flex-wrap: wrap;
                height: auto;
                min-height: var(--nav-height);
            }
            .navbar-brand {
                font-size: 1rem;
            }
            .navbar-links {
                gap: 0.1rem 0.5rem;
            }

                            <div class="head">
                                <span class="name">${safeText(p.name)}</span>
                                <span class="meta">${safeText(p.type)} · ${safeText(p.period)}</span>
                            </div>
                            ${techHtml}
                            <ul>${p.details.map(d => `<li>${d}</li>`).join('')}</ul>
                        </div>
                    </div>
                `;
            }).join('');

            const btns = $$('[role="tab"]', nav);
            const panelsList = $$('.tabs-panel', panels);

            function activateTab(index) {
                btns.forEach((b, i) => {
                    const isActive = i === index;
                    b.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    b.setAttribute('tabindex', isActive ? '0' : '-1');
                    if (panelsList[i]) {
                        panelsList[i].setAttribute('aria-hidden', isActive ? 'false' : 'true');
                    }
                });
                if (btns[index]) btns[index].focus();
            }

            btns.forEach((btn, idx) => {
                btn.addEventListener('click', () => activateTab(idx));
                btn.addEventListener('keydown', (e) => {
                    let target = idx;
                    if (e.key === 'ArrowRight') target = (idx + 1) % btns.length;
                    else if (e.key === 'ArrowLeft') target = (idx - 1 + btns.length) % btns.length;
                    else return;
                    e.preventDefault();
                    activateTab(target);
                });
            });

            if (btns.length) activateTab(0);
        }

        // -- Skills --
        function renderSkills() {
            const container = document.getElementById('skillsGrid');
            container.innerHTML = resume.skills.map(g => `
                <div class="group">
                    <h4>${g.name}</h4>
                    <div class="chips">${g.items.map(t => `<span>${t}</span>`).join('')}</div>
                </div>
            `).join('');
        }

        // -- Education & Awards (with certificates) --
        function renderEduAwards() {
            const container = document.getElementById('eduAwardsContainer');
            const edu = resume.education;
            const awards = resume.awards;

            let html = '';

            // ---- 证书图片展示 ----
            html += `
                <div class="cert-gallery">
                    <div class="cert-card">
                        <img src="gaoji.jpg" alt="高级人工智能训练师证书" loading="lazy" onerror="this.style.opacity='0.3';this.alt='图片加载失败'">
                        <div class="cert-label">高级人工智能训练师</div>
                        <div class="cert-sub">达摩院 · 2025</div>
                    </div>
                    <div class="cert-card">
                        <img src="rag.jpg" alt="阿里云 Apsara Clouder RAG 认证" loading="lazy" onerror="this.style.opacity='0.3';this.alt='图片加载失败'">
                        <div class="cert-label">阿里云 Apsara Clouder - RAG</div>
                        <div class="cert-sub">专项技能认证</div>
                    </div>
                    <div class="cert-card">
                        <img src="vis.jpg" alt="阿里云 Apsara Clouder VIS 认证" loading="lazy" onerror="this.style.opacity='0.3';this.alt='图片加载失败'">
                        <div class="cert-label">阿里云 Apsara Clouder - VIS</div>
                        <div class="cert-sub">专项技能认证</div>
                    </div>
                </div>
            `;

            // Education
            if (edu) {
                const coursesHtml = edu.courses ? `<div class="courses">📚 主修课程：${edu.courses}</div>` : '';
                const gpaHtml = edu.gpa ? `<span class="detail">GPA：${edu.gpa}</span>` : '';
                const rankHtml = edu.ranking ? `<span class="detail">专业排名：${edu.ranking}</span>` : '';
                html += `
                    <div class="edu-block">
                        <div class="school">${safeText(edu.school)}</div>
                        <div class="major">${safeText(edu.major)} · ${safeText(edu.degree)}</div>
                        <div class="period">${safeText(edu.period)}</div>
                        ${gpaHtml || rankHtml ? `<div>${joinTruthy([gpaHtml, rankHtml], ' · ')}</div>` : ''}
                        ${coursesHtml}
                    </div>
                `;
            }

            // Awards
            if (awards && awards.length) {
                const validAwards = awards.filter(a => a.name);
                if (validAwards.length) {
                    html += `
                        <div style="margin-top:0.5rem;">
                            <div style="font-weight:600; color:var(--color-primary); margin-bottom:0.4rem;">🏅 获奖与认证</div>
                            <div class="awards-list">
                                ${validAwards.map(a => `
                                    <div class="award">
                                        <span class="name">${a.name}</span>
                                        <span class="source">${a.source ? ' · ' + a.source : ''}</span>
                                        ${a.date ? `<span class="date">${a.date}</span>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }

            container.innerHTML = html || '<p style="color:var(--color-text-secondary);">暂无教育或证书信息</p>';
        }

        // ================================================================
        //  THEME / PRINT / BACK-TOP
        // ================================================================

        function initTheme() {
            const toggle = document.getElementById('themeToggle');
            const stored = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let theme = stored || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            toggle.textContent = theme === 'dark' ? '☀️' : '🌓';

            toggle.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                toggle.textContent = next === 'dark' ? '☀️' : '🌓';
            });
        }

        function initPrint() {
            document.getElementById('printBtn').addEventListener('click', () => {
                window.print();
            });
        }

        function initBackTop() {
            const btn = document.getElementById('backTop');
            let visible = false;
            window.addEventListener('scroll', () => {
                const scrollY = window.pageYOffset || document.documentElement.scrollTop;
                if (scrollY > 400 && !visible) {
                    visible = true;
                    btn.classList.add('visible');
                } else if (scrollY <= 400 && visible) {
                    visible = false;
                    btn.classList.remove('visible');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // ================================================================
        //  NAV LINKS - smooth scroll
        // ================================================================
        function initNavScroll() {
            document.querySelectorAll('.navbar-links a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = link.getAttribute('href');
                    if (target && target.startsWith('#')) {
                        const el = document.querySelector(target);
                        if (el) {
                            const offset = 80;
                            const top = el.getBoundingClientRect().top + window.pageYOffset - offset;
                            window.scrollTo({ top, behavior: 'smooth' });
                        }
                    }
                });
            });
        }

        // ================================================================
        //  INIT
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            // 头像和二维码已硬编码在HTML中，无需动态插入
            renderHeroTags();
            renderHeroContact();
            renderHighlights();
            renderExperience();
            renderProjects();
            renderSkills();
            renderEduAwards();
            initTheme();
            initPrint();
            initBackTop();
            initNavScroll();
        });
    </script>

</body>
</html>
